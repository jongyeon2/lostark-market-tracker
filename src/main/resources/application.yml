# Base configuration. Connection values come from environment placeholders only
# (no real secrets committed). Profile-specific overrides live in application-{dev,test}.yml.
spring:
  application:
    name: lostark-price-tracker

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/lostark}
    username: ${POSTGRES_USER:lostark}
    password: ${POSTGRES_PASSWORD:lostark}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    # Flyway owns the schema (D-02); JPA only validates entity<->schema agreement, never creates/alters.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

# Lostark developer-portal markets API. Key from env only (never committed); base-url defaults
# to the portal host confirmed in Task 0. Auth/normalization handled in LostarkApiClient.
lostark:
  api:
    base-url: ${LOSTARK_API_BASE_URL:https://developer-lostark.game.onstove.com}
    key: ${LOSTARK_API_KEY:}

# Lostark official news (events + notices) — independent low-frequency poller feeding the dashboard
# panel (D-01/D-06). Its own schedule + Redis key (news:latest, TTL fixed at 12h in NewsService);
# ~2 requests / 6h, so it never competes with the market collection rate-limit budget.
news:
  poll-interval-ms: ${NEWS_POLL_INTERVAL_MS:21600000}   # 6h between refreshes (fixedDelay)
  initial-delay-ms: ${NEWS_INITIAL_DELAY_MS:0}          # boot-time refresh; tests push this out

# Shared secret guarding /api/admin/** (X-Admin-Secret header). From env only, never committed
# (mirrors lostark.api.key). Blank/unset => the admin gate fails CLOSED (every /api/admin/** is 401)
# while the public read surface and the collection pipeline keep running.
admin:
  api:
    secret: ${ADMIN_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
