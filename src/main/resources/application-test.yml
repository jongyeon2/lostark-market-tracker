# Test profile: datasource and Redis connection are supplied at runtime by Testcontainers
# via @DynamicPropertySource (see com.lostark.tracker.support.PostgresRedisContainers).
# No static connection config here on purpose — the containers provide ephemeral coordinates.
spring:
  jpa:
    show-sql: false

# Keep the @Scheduled collector from auto-firing during integration tests — ITs drive
# collectTick() directly with a pinned clock + short timeouts.
collection:
  initial-delay-ms: 3600000

# Same for the news poller — ITs drive NewsService.refresh() directly with a mocked client,
# so push the boot-time news refresh far out to keep it from making a live /news call.
news:
  initial-delay-ms: 3600000

# Fixed, non-sensitive test secret. The 04-01 admin ITs inject @Value("${admin.api.secret:test-admin-secret}")
# and send it as X-Admin-Secret, so the gate accepts their requests with zero retrofit.
admin:
  api:
    secret: test-admin-secret
