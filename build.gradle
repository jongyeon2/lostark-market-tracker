plugins {
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.lostark'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('testcontainersVersion', "1.21.3")
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Flyway (PostgreSQL)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // Redis test container uses Testcontainers core GenericContainer (no extra dependency).
}

tasks.named('test') {
    useJUnitPlatform()
    // Testcontainers/docker-java default to Docker API v1.32, which Docker Engine 29.x rejects
    // (MinAPIVersion=1.40) with HTTP 400. docker-java reads the `api.version` system property, so
    // pin a version within the engine's supported range. Override with -PdockerApiVersion=<ver>.
    def apiVer = (project.findProperty('dockerApiVersion') ?: '1.44').toString()
    if (apiVer?.trim()) {
        systemProperty 'api.version', apiVer.trim()
    }
}
