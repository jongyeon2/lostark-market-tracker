<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loaket · 로스트아크 시세 트래커</title>
    <!--
      테마 부트스트랩. defer/async 없이 <head>에서 불러 본문 파싱 전에 동기 실행된다 — 첫 페인트 전에
      끝나야 다크 사용자에게 흰 화면이 번쩍하지 않는다(FOUC).

      인라인이 아니라 별도 파일인 이유는 운영 CSP가 `script-src 'self'`이기 때문이다. 자세한 근거는
      public/theme-init.js 주석에.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
