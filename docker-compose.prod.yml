# Prod 스택(Phase 18) — Oracle Always Free VM 단일 박스. 운영은 GHCR 이미지 pull 기반으로 기동한다
# (Phase 19 CI/CD): `IMAGE_TAG=sha-<커밋> docker compose -f docker-compose.prod.yml --env-file .env.prod
# pull && up -d`. VM에서 소스 빌드하지 않는다(`--build` 없음). 아래 `build:` 블록은 오프라인 폴백.
#
# 보안 네트워킹(DEPLOY-03): app·postgres·redis는 host 포트를 열지 않고(내부 `internal` 네트워크
# 전용), 오직 caddy만 80/443을 publish한다 → DB/Redis/app은 인터넷에서 도달 불가.
# 시크릿(DEPLOY-04)은 .env.prod(gitignore)에서만 주입. redis는 requirepass로 심층 방어.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # CI(GitHub Actions)가 이 이미지를 GHCR에 push한다. VM은 `IMAGE_TAG=sha-xxx ... pull && up -d`로
    # 완성 이미지만 받아 실행(4GB ARM에서 빌드 안 함). build: 는 로컬 폴백. IMAGE_TAG 미설정 시 latest.
    image: ghcr.io/jongyeon2/lostark-app:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOSTARK_API_KEY: ${LOSTARK_API_KEY}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET}
      # 수집 하트비트 데드맨 핑 URL(시크릿). 미설정이면 앱이 no-op → 감시만 꺼지고 수집은 정상.
      COLLECTION_PING_URL: ${COLLECTION_PING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
    # ★ NO ports: — caddy 경유로만 도달(외부 미노출)

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
    # ★ NO ports: — 내부 네트워크 전용

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
    # ★ NO ports: — 내부 네트워크 전용 + requirepass

  caddy:
    build:
      context: frontend
      dockerfile: Dockerfile
    # web(프론트+Caddy) 이미지도 CI가 GHCR에 push, VM은 pull. build: 는 로컬 폴백.
    image: ghcr.io/jongyeon2/lostark-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
      # tailnet 전용 관리자 리스너(quick-260716-k35). 관리자 화면은 공개 인터넷에 없고 여기서만 뜬다.
      #
      # ⚠️ "100.x.x.x:8081:8081"처럼 tailnet IP에 직접 bind하지 않는다. 더 안전해 보이지만,
      # 재부팅 때 Docker가 Tailscale보다 먼저 뜨면 그 IP가 아직 없어 bind에 실패하고 Caddy 컨테이너가
      # 통째로 안 뜬다 — Caddy는 공개 사이트도 서빙하므로 관리자 편의 때문에 사이트 전체가 죽는다.
      # 대신 0.0.0.0에 열고 방화벽으로 막는다(런북 §4(c)): OCI 보안목록에 8081 미추가가 실질 차단이고,
      # DOCKER-USER/INPUT의 tailscale0 외 DROP이 심층 방어다. 22번에 이미 쓰는 것과 같은 사고방식.
      - "8081:8081"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks: [internal]
    # ★ 유일한 publish(80/443) — 공개 진입점

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
