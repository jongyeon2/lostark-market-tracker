plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.lostark'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('testcontainersVersion', "1.21.3")
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Flyway (PostgreSQL)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // Redis test container uses Testcontainers core GenericContainer (no extra dependency).
}

tasks.named('test') {
    useJUnitPlatform()
    // Testcontainers/docker-java default to Docker API v1.32, which Docker Engine 29.x rejects
    // (MinAPIVersion=1.40) with HTTP 400. docker-java reads the `api.version` system property, so
    // pin a version within the engine's supported range. Override with -PdockerApiVersion=<ver>.
    def apiVer = (project.findProperty('dockerApiVersion') ?: '1.44').toString()
    if (apiVer?.trim()) {
        systemProperty 'api.version', apiVer.trim()
    }
}

tasks.named('bootRun') {
    // Local DX: load the gitignored .env into the bootRun JVM so `./gradlew bootRun` receives
    // LOSTARK_API_KEY / ADMIN_API_SECRET the same way docker-compose does — the .env.example promise.
    // Without this, bootRun's forked JVM has neither var, so dev collection fails AUTH_ERROR and the
    // admin gate fails closed (every /api/admin/** returns 401). Real shell env vars take precedence
    // (CI/prod inject them directly); a missing .env is a no-op. Only bootRun is affected — never test.
    def dotenv = rootProject.file('.env')
    if (dotenv.exists()) {
        dotenv.readLines('UTF-8').each { rawLine ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#') || !line.contains('=')) {
                return
            }
            def idx = line.indexOf('=')
            def key = line.substring(0, idx).trim()
            def value = line.substring(idx + 1).trim()
            if ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            if (!key.isEmpty() && System.getenv(key) == null) {
                environment key, value
            }
        }
    }
}
